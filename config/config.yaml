# strong cell-signature cohort (func_enrich_all_sel): which compounds enter the
# structure<->cell-state analysis (signature clustering + chemistry->class ML).
# NOT gated on gsea_fdr — it flags ~all compounds (incl. Silent), so it can't
# define signal. Gate = response-magnitude floor AND a dominant signature axis.
SIG_ACTIVITY_BINS:            # MS activity labels to keep (ndown >= 2)
- Low (2-10)
- Medium (11-25)
- High (>25)
SIG_MAX_ABS_NES: 2.0          # require peak |GSEA NES| >= this across the functions
SIG_K: 2                      # number of cell-signature classes (KMeans on the NES vectors)

CONTAMINANTS: data/MS/20260611_contaminants.csv
CONTROLS:
- SRB-0000692
- SRB-0000615

# which blacklists are concatenated into cm2rm (the compounds dropped from every training set).
# Any subset of: fbx_independent (serac_df Px_Ligase_dependent == 0 or Px_validated_WT == 0) |
# control_compounds (CONTROLS above) | contaminants (the CONTAMINANTS csv). A `parts=` argument
# to DATA.get_contaminants_and_controls, or --cm2rm on the CLI, overrides this.
CM2RM_PARTS: [contaminants, fbx_independent]

# disease association research:
FUNC_ENRICH_PATH: output/cell_signature/compound_function_enrichment.parquet

# 250 representative-compound selection (MS_TargetML "Get 250 compounds"):
# k-means over [PCoA(Tanimoto) chemical comps | 8 Hallmark-theme NES], one medoid/cluster.
STOCK_INVENTORY: /mnt/c/Users/gtamo/Serac Biosciences Dropbox/Serac_team/8_Data_Warehouse/Inventory/Inventory update for SRCBS_20260703.xlsx
STOCK_PWS: WX-SRCBS
STOCK_SHEET: Solid(II)
STOCK_ID_COL: Batch Molecule Batch ID   # batch id (SRB-XXXXXXX-NNN); compound = its SRB-XXXXXXX prefix

GENE_SAR_OUT: output/MS/20260812_geneSAR_R2_full_genome.csv   # per-gene screen results (resumable: delete to redo)
EXCLUDE_DATES: ['2026-08-13']   # tranches dropped from df_raw AND MS at load (in memory; parquets keep them)

CHEMLIB_OVERWRITE: false
DFRAW_OVERWRITE: false

