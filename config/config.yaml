# Project parameters — single source of truth across all MS_ML notebooks.
# Loaded in each notebook's params cell via yaml.safe_load + globals().update(),
# so both `config.RAW_PROTEOMICS_PATH` and bare `RAW_PROTEOMICS_PATH` work.
# Conflicting keys were unified to the MS_TargetML (most recent) values.

# colors
ACTIVE_C: '#008bfb'
SILENT_C: '#ff0051'
SERAC_C:                    # named palette: name -> hex (quote hex; '#' is a YAML comment otherwise)
  azure: '#0EA5CE'
  ember: '#E65D32'
  terracotta: '#EEA090'
  gold: '#E8B04B'
  olive: '#74B24A'
  cornflowerblue: '#A6C8E4'
  paper: '#E3E0DA'
  light_blue: '#CAEEFB'
  sky_blue: '#96DCF8'


# Dropbox access over SSH — pull/push company-Dropbox files from machines without the desktop client.
# The path keys below (PATENTS_RAW, PX_*, DROPBOX_*, FBX_DIR, ENAMINE_*, STOCK_INVENTORY, ...) are
# absolute WSL paths where the laptop's Dropbox client syncs. fn.pull_from_dropbox / open_dropbox /
# push_to_dropbox stream those paths verbatim over passwordless ssh — nothing is written to local disk.
# See README "Pulling data files from Dropbox" for the reverse-tunnel setup.
DROPBOX_SSH_HOST: gtamo@localhost   # reverse-tunnel endpoint to the laptop's WSL sshd (ssh -R 2223:localhost:22 cluster)
DROPBOX_SSH_PORT: 2222

# rclone backend (preferred): pulls straight from Dropbox, so no laptop / tunnel is needed.
# fn.open_rclone / pull_rclone / glob_rclone / push_rclone map the WSL paths below to
# <DROPBOX_REMOTE><path minus DROPBOX_LOCAL_ROOT>. Set DROPBOX_BACKEND: ssh to fall back
# to the reverse tunnel. The rclone remote must point at the team namespace (root_namespace).
DROPBOX_BACKEND: rclone             # 'rclone' (no laptop needed) | 'ssh' (reverse tunnel)
DROPBOX_REMOTE: 'dropbox:'          # configured rclone remote (rclone listremotes)
DROPBOX_LOCAL_ROOT: /mnt/c/Users/gtamo/Serac Biosciences Dropbox/   # stripped to get the remote path

