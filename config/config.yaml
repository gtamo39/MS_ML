# strong cell-signature cohort (func_enrich_all_sel): which compounds enter the
# structure<->cell-state analysis (signature clustering + chemistry->class ML).
# NOT gated on gsea_fdr — it flags ~all compounds (incl. Silent), so it can't
# define signal. Gate = response-magnitude floor AND a dominant signature axis.
SIG_ACTIVITY_BINS:            # MS activity labels to keep (ndown >= 2)
- Low (2-10)
- Medium (11-25)
- High (>25)
SIG_MAX_ABS_NES: 2.0          # require peak |GSEA NES| >= this across the functions
SIG_K: 2                      # number of cell-signature classes (KMeans on the NES vectors)

